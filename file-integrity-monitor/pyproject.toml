[project]
name = "fim"
version = "0.1.0"
description = "File integrity monitor: detect added, removed and modified files with SHA-256"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fim = "fim.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
